<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявка — Автостекло Юлдаш</title><link rel="stylesheet" href="style.css"></head><body class="form-page"><header><a class="brand" href="index.html">АВТОСТЕКЛО <b>ЮЛДАШ</b></a><a class="header-link" href="index.html">← На главную</a></header><main class="request"><div><p class="eyebrow red">ЗАЯВКА НА УСТАНОВКУ</p><h1>Расскажите<br>о вашем авто.</h1><p class="form-intro">Заполните данные — подготовим сообщение для WhatsApp. Перед отправкой вы сможете его проверить.</p></div><form id="request-form"><label>Номер телефона<input name="phone" type="tel" autocomplete="tel" placeholder="+7 (999) 123-45-67" required></label><label>Марка и модель автомобиля<input name="car" placeholder="Например, Lada Vesta" required></label><label>Куда написать<select name="channel"><option value="WhatsApp">WhatsApp</option></select></label><button class="button" type="submit">Перейти в WhatsApp <span>↗</span></button><p class="form-hint" id="status" aria-live="polite">Сообщение откроется в WhatsApp. Нажмите «Отправить» в чате.</p></form></main><script src="script.js"></script></body></html>
